# Behavior-seed job.
#
# Runs seed_gtm_events.py to backfill a multi-week, ~100-user GA4-style stream
# into gtm_events (raw Delta). View/cart focus only (event_purchase is out of
# scope — Lakebase is the money fact). The silver pipeline then derives
# event_view_item + event_add_to_cart from this.
resources:
  jobs:
    powertools_seed_gtm:
      name: "powertools-seed-gtm"
      tasks:
        - task_key: seed_gtm_events
          environment_key: default
          spark_python_task:
            python_file: ../src/seed_gtm_events.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--weeks=6"
              - "--users=100"
      environments:
        - environment_key: default
          spec:
            client: "3"
