# Build job — one-time initialization/backfill only. It waits for the CDC
# sources, creates the shared UUID function, and appends the deterministic GTM
# seed exactly once. The always-on silver pipeline is started independently;
# keeping it out of this finite DAG prevents the job from waiting forever.
#
# Full pipeline order (see ../../RUNBOOK.md):
#   (a) provision Lakebase + seed OLTP  — deploy etl/, then run
#       ../src/seed_lakebase_oltp.py (products/accounts/carts/purchases +
#       REPLICA IDENTITY FULL). External to this job.
#   (b) Lakebase CDF Lakebase -> Delta   — the native change data feed
#       (see ../resources/lakebase.yml); produces lb_*_history in UC, batched
#       ~every 15s. Enabled + started outside the bundle (UI, one-time), and a
#       PREREQUISITE of this job: both seed_gtm_events (reads lb_products_history)
#       and the silver pipeline's AUTO CDC flows (read all lb_*_history) need it
#       populated first. The `wait_for_cdc` gate task below enforces that
#       readiness before any data task runs.
#   wait_for_cdc (gate) + create_canonical_uuid (UC function) -> (c) one-time GTM
#       behavior seed are the tasks below. Never schedule or repeat this job:
#       seed_gtm_events appends and a rerun would double the funnel. The CDC
#       current-state collapse (dim_*/fact_*) is native AUTO CDC inside the
#       independently running silver pipeline. Binary-UUID normalization is
#       centralized in the canonical_uuid(BINARY) UC function; create_canonical_uuid
#       has no dependency, so it runs CONCURRENTLY with wait_for_cdc but always
#       COMPLETES BEFORE its consumers — the seed (which normalizes binary ids) and
#       the pipeline (whose AUTO CDC flows call it) — because both depend on it.
#       SDP does not track UC-function dependencies and DABs has no function
#       resource type, so this pre-pipeline task is the guarantee.
resources:
  jobs:
    powertools_build:
      name: "powertools-build"
      # No `volume` job parameter: none of these one-time tasks touch PDF Volumes.
      # The raw-doc Volumes were split into productmanuals + datasheets; the
      # only file-reading consumer is the IDP transformation, which carries its
      # own literal Volume path (see idp_parsed_datasheets.sql).
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        # (b-gate) CDC readiness gate. The Lakebase CDF feed (b) is enabled
        #     outside this job, so this first task POLLS until all four
        #     lb_*_history change-logs exist AND are populated before anything
        #     downstream reads them — failing loudly on timeout rather than
        #     building empty Genie tables.
        - task_key: wait_for_cdc
          environment_key: default
          spark_python_task:
            python_file: ../src/wait_for_cdc.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"

        # (b-fn) Create the canonical_uuid(BINARY) UC function in <catalog>.default
        #     — the single source of truth for the Lakebase-CDF binary-UUID ->
        #     canonical-text transform. Has no dependency, so it runs concurrently
        #     with wait_for_cdc but always completes before its consumers —
        #     seed_gtm_events (normalizes binary product ids) and the silver
        #     pipeline (its AUTO CDC flows call the function) — since both depend on
        #     it. SDP does not track UC-function dependencies and DABs has no
        #     function resource type, so this task is how the function is guaranteed
        #     to exist at pipeline analysis time. It lives in `default` (not
        #     techsummit) so the pipeline's bare canonical_uuid() call resolves via
        #     SDP's <catalog>.default search path while the catalog still follows
        #     the bundle target.
        - task_key: create_canonical_uuid
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/create_canonical_uuid.sql

        # (c) GTM behavior seed -> gtm_events. Reads lb_products_history, so the
        #     CDC sync (b) must already be populated — gated by wait_for_cdc. Also
        #     depends on create_canonical_uuid: the seed normalizes the binary
        #     product ids via the same function.
        - task_key: seed_gtm_events
          depends_on:
            - task_key: wait_for_cdc
            - task_key: create_canonical_uuid
          environment_key: default
          spark_python_task:
            python_file: ../src/seed_gtm_events.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--weeks=6"
              - "--users=100"

      environments:
        - environment_key: default
          spec:
            client: "3"
