# Build job — the single orchestration DAG that turns raw sources into the 7
# base tables Genie consumes. One job so the ordering is a real, enforced
# task dependency graph rather than a hope expressed in the RUNBOOK.
#
# Full pipeline order (see ../../RUNBOOK.md):
#   (a) provision Lakebase + seed OLTP  — deploy etl/, then run
#       ../src/seed_lakebase_oltp.py (products/accounts/carts/purchases +
#       REPLICA IDENTITY FULL). External to this job.
#   (b) Lakebase CDF Lakebase -> Delta   — the native change data feed
#       (see ../resources/lakebase.yml); produces lb_*_history in UC, batched
#       ~every 15s. Enabled + started outside the bundle (UI, one-time), and a
#       PREREQUISITE of this job: both seed_gtm_events (reads lb_products_history)
#       and the silver pipeline's AUTO CDC flows (read all lb_*_history) need it
#       populated first. The `wait_for_cdc` gate task below enforces that
#       readiness before any data task runs.
#   wait_for_cdc (gate) + create_canonical_uuid (UC function) -> (c) GTM behavior
#       seed -> (d) silver pipeline -> (e) key_normalize are the tasks below,
#       chained so each runs strictly after the last. The CDC current-state
#       collapse (dim_*/fact_*) is no longer a separate task — it is now native
#       AUTO CDC inside the silver pipeline (d). The binary-UUID normalization is
#       centralized in the canonical_uuid(BINARY) UC function; create_canonical_uuid
#       runs FIRST so the function exists before BOTH the seed (which normalizes
#       binary ids) and the pipeline (whose AUTO CDC flows call it) — SDP does not
#       track UC-function dependencies and DABs has no function resource type, so
#       this pre-pipeline task is the guarantee.
resources:
  jobs:
    powertools_build:
      name: "powertools-build"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        # (b-gate) CDC readiness gate. The Lakebase CDF feed (b) is enabled
        #     outside this job, so this first task POLLS until all four
        #     lb_*_history change-logs exist AND are populated before anything
        #     downstream reads them — failing loudly on timeout rather than
        #     building empty Genie tables.
        - task_key: wait_for_cdc
          environment_key: default
          spark_python_task:
            python_file: ../src/wait_for_cdc.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"

        # (b-fn) Create the canonical_uuid(BINARY) UC function — the single source
        #     of truth for the Lakebase-CDF binary-UUID -> canonical-text transform.
        #     Runs FIRST (no dependency) so the function exists before BOTH
        #     seed_gtm_events (normalizes binary product ids) and the silver
        #     pipeline (its AUTO CDC flows call the function). SDP does not track
        #     UC-function dependencies and DABs has no function resource type, so
        #     this task is how the function is guaranteed to exist at pipeline
        #     analysis time.
        - task_key: create_canonical_uuid
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/create_canonical_uuid.sql

        # (c) GTM behavior seed -> gtm_events. Reads lb_products_history, so the
        #     CDC sync (b) must already be populated — gated by wait_for_cdc. Also
        #     depends on create_canonical_uuid: the seed normalizes the binary
        #     product ids via the same function.
        - task_key: seed_gtm_events
          depends_on:
            - task_key: wait_for_cdc
            - task_key: create_canonical_uuid
          environment_key: default
          spark_python_task:
            python_file: ../src/seed_gtm_events.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--weeks=6"
              - "--users=100"

        # (d) silver pipeline. Builds, all as streaming tables:
        #     - gtm_events -> event_view_item + event_add_to_cart
        #     - lb_*_history -> dim_product / dim_customer / fact_purchase /
        #       fact_purchase_line via NATIVE AUTO CDC (the engine does the
        #       CDC merge/collapse — no ROW_NUMBER warehouse task). See
        #       ../pipelines/silver/transformations/{dim_product,dim_customer,
        #       fact_purchase,fact_purchase_line}.sql.
        #     - datasheet PDFs -> product_specs (IDP: _parsed_datasheets ->
        #       _extracted_specs -> product_specs). product_specs no longer joins
        #       dim_product, so IDP does not depend on the curate task below.
        - task_key: run_silver_pipeline
          depends_on:
            - task_key: seed_gtm_events
          pipeline_task:
            pipeline_id: ${resources.pipelines.powertools_silver.id}
            full_refresh: false

        # (e) event_* silver -> fact_view_item / fact_add_to_cart (id-normalized).
        #     The terminal warehouse task. It has no data dependency on the CDC
        #     tables (it only reads the event_* silver tables), but must run after
        #     the silver pipeline that produces them — hence depends_on the
        #     pipeline (which now also builds the CDC current-state tables).
        - task_key: key_normalize
          depends_on:
            - task_key: run_silver_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/key_normalize.sql
      environments:
        - environment_key: default
          spec:
            client: "3"
