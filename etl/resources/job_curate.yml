# Curate job — turns the raw CDC history + raw events + PDFs into the 7 base
# tables Genie consumes. Runs after the seed + silver pipeline + CDC sync.
#
# Steps (SQL, in order):
#   1. cdc_to_current.sql   lb_*_history -> dim_product / dim_customer /
#                           fact_purchase / fact_purchase_line (current state)
#   2. key_normalize.sql    event_view_item/event_add_to_cart id-normalize ->
#                           fact_view_item / fact_add_to_cart (item_id=product_id)
#   3. idp_product_specs.sql ai_parse_document + ai_extract on datasheet PDFs ->
#                           product_specs (+ model_name -> product_id crosswalk)
resources:
  jobs:
    powertools_curate:
      name: "powertools-curate"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: cdc_to_current
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/cdc_to_current.sql
        - task_key: key_normalize
          depends_on:
            - task_key: cdc_to_current
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/key_normalize.sql
        - task_key: idp_product_specs
          depends_on:
            - task_key: key_normalize
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/idp_product_specs.sql
