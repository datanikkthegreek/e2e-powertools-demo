# Lakebase -> Delta CDC sync (wal2delta).
#
# Streams the WAL of the required Lakebase tables into Delta change-logs
# (lb_*_history) in the techsummit schema. Genie NEVER sees these history
# tables directly — the curate job (cdc_to_current.sql) collapses them to
# current state (dim_* / fact_*).
#
# BINDING: every synced table names the Lakebase project THIS bundle
# provisions (etl/resources/lakebase.yml) via
# `${resources.postgres_projects.techsummit.project_id}`. That interpolation
# both (a) targets the techsummit project rather than some ambient instance and
# (b) makes DAB order the project's creation before these synced tables, so the
# sync can never point at a project that doesn't exist yet.
#
# Only the tables the demo needs are synced:
#   products      -> lb_products_history        (-> dim_product)
#   accounts      -> lb_accounts_history         (-> dim_customer)
#   purchases     -> lb_purchases_history        (-> fact_purchase)
#   purchase_lines-> lb_purchase_lines_history   (-> fact_purchase_line)
# carts / cart_items are OLTP-only (not synced): the funnel comes from the
# behavioral event stream, and the money fact comes from purchases.
resources:
  synced_database_tables:
    lb_products_history:
      name: ${var.catalog}.${var.schema}.lb_products_history
      database_instance_name: ${resources.postgres_projects.techsummit.project_id}
      logical_database_name: databricks_postgres
      spec:
        source_table_full_name: public.products
        primary_key_columns:
          - id
        scheduling_policy: CONTINUOUS
        create_database_objects_if_missing: false
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${var.schema}

    lb_accounts_history:
      name: ${var.catalog}.${var.schema}.lb_accounts_history
      database_instance_name: ${resources.postgres_projects.techsummit.project_id}
      logical_database_name: databricks_postgres
      spec:
        source_table_full_name: public.accounts
        primary_key_columns:
          - id
        scheduling_policy: CONTINUOUS
        create_database_objects_if_missing: false
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${var.schema}

    lb_purchases_history:
      name: ${var.catalog}.${var.schema}.lb_purchases_history
      database_instance_name: ${resources.postgres_projects.techsummit.project_id}
      logical_database_name: databricks_postgres
      spec:
        source_table_full_name: public.purchases
        primary_key_columns:
          - id
        scheduling_policy: CONTINUOUS
        create_database_objects_if_missing: false
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${var.schema}

    lb_purchase_lines_history:
      name: ${var.catalog}.${var.schema}.lb_purchase_lines_history
      database_instance_name: ${resources.postgres_projects.techsummit.project_id}
      logical_database_name: databricks_postgres
      spec:
        source_table_full_name: public.purchase_lines
        primary_key_columns:
          - id
        scheduling_policy: CONTINUOUS
        create_database_objects_if_missing: false
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${var.schema}
