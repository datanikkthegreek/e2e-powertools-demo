# App bundle resource: the Bosch Power Tools webshop Databricks App.
#
# It connects to the techsummit Lakebase (Postgres) OLTP database that the
# etl/ bundle provisions. Runtime configuration (command + env, including the
# LAKEBASE_PROJECT_ID=techsummit coordinates) lives in ../app.yml, which
# `apx build` copies into ./.build (the source_code_path below).
resources:
  apps:
    powertools-webshop-app:
      name: "powertools-webshop"
      description: "Bosch Power Tools webshop — Databricks App on the techsummit Lakebase project."
      source_code_path: ../.build
      # NOTE: the storefront connects to Lakebase and the SQL warehouse as the
      # APP SERVICE PRINCIPAL (WorkspaceClient() -> w.postgres credential), not
      # on behalf of the signed-in user. The only OBO call is the /me identity
      # endpoint, which needs no extra scope. We therefore declare no
      # user_api_scopes (the `postgres` OBO scope is also disallowed in this
      # workspace). The app SP is instead granted a Postgres role on the
      # techsummit Lakebase project post-deploy (see the "Deploying the Bosch
      # Power Tools webshop onto the techsummit Lakebase" section in ./README.md).
      resources:
        # Zerobus OAuth client secret, injected as an env var via valueFrom
        # in ../app.yml (keeps the plaintext secret out of source control).
        - name: "zerobus-client-secret"
          secret:
            scope: "cdp_demo"
            key: "zerobus_client_secret"
            permission: "READ"
